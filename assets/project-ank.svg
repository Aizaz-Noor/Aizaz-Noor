<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-labelledby="title"><title id="title">ANK-CINEMA</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26332c"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 2s ease-in-out infinite}.signal{stroke-dasharray:6 8;animation:flow 5s linear infinite}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-70}}@media(prefers-reduced-motion:reduce){.pulse,.signal{animation:none}}</style><rect width="560" height="240" rx="18" fill="#101612"/><rect width="560" height="240" rx="18" fill="url(#dots)"/><rect x="1" y="1" width="558" height="238" rx="17" fill="none" stroke="#314036"/><g fill="#ffbc83"><text x="26" y="32" class="mono" font-size="11" letter-spacing="2" fill="#a3b1a8">04 / TERMINAL TOOLING</text><text x="26" y="75" font-size="34" font-weight="700" fill="#f0f4ec">ANK-CINEMA</text><text x="530" y="71" text-anchor="end" font-size="27">↗</text><rect x="27" y="107" width="507" height="108" rx="9" fill="#0b100d" stroke="#524538"/><text x="44" y="133" class="mono" font-size="13">$ ank-cinema</text><text x="44" y="159" class="mono" font-size="12" fill="#a3b1a8">[ parallel search ] → [ deduplicate ]</text><text x="44" y="186" class="mono" font-size="12" fill="#d6ded7">[ enrich magnets ]  → [ aria2c ]</text><rect class="pulse" x="483" y="175" width="8" height="15"/></g></svg>
